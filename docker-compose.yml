version: '3.8'

services:

  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - barbearia

  php:
    build: ./docker/php
    volumes:
      - ./src:/var/www/html
    networks:
      - barbearia

  mysql:
    image: mariadb:11
    container_name: barbearia_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: barbearia
      MYSQL_USER: barbearia
      MYSQL_PASSWORD: barbearia
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - barbearia

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
    networks:
      - barbearia

volumes:
  mysql_data:

networks:
  barbearia: